stages:
  - validate
  - plan
  - apply

variables:
  TF_IMAGE: hashicorp/terraform:1.9.8

.terraform:
  image:
    name: $TF_IMAGE
    entrypoint: [""]
  cache:
    key: terraform-$CI_JOB_NAME
    paths:
      - $TF_DIR/.terraform

# Cloudflare — always runs, credentials via CI/CD variables
validate:cloudflare:
  extends: .terraform
  stage: validate
  variables:
    TF_DIR: terraform/cloudflare
  before_script:
    - cd $TF_DIR
    - terraform init -backend=false
  script:
    - terraform validate
    - terraform fmt -check -recursive

plan:cloudflare:
  extends: .terraform
  stage: plan
  variables:
    TF_DIR: terraform/cloudflare
    TF_VAR_cloudflare_api_token: $CLOUDFLARE_API_TOKEN
  before_script:
    - cd $TF_DIR
    - terraform init -backend=false
  script:
    - terraform plan
  only:
    - merge_requests
    - master

# AWS — skipped until AWS_ACCESS_KEY_ID is set in CI/CD variables
validate:aws:
  extends: .terraform
  stage: validate
  variables:
    TF_DIR: terraform/aws
  before_script:
    - cd $TF_DIR
    - terraform init -backend=false
  script:
    - terraform validate
    - terraform fmt -check -recursive
  rules:
    - if: $AWS_ACCESS_KEY_ID != null && $AWS_ACCESS_KEY_ID != ""
