---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-tts
  namespace: ai
spec:
  replicas: 0  # disabled 2026-10-03 (unused)
  selector:
    matchLabels:
      app: kokoro-tts
  template:
    metadata:
      labels:
        app: kokoro-tts
    spec:
      nodeSelector:
        kubernetes.io/hostname: mikepc
      containers:
        - name: kokoro-tts
          image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8880
          resources:
            requests:
              memory: "512Mi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "6"
---
apiVersion: v1
kind: Service
metadata:
  name: kokoro-tts
  namespace: ai
spec:
  selector:
    app: kokoro-tts
  ports:
    - port: 8880
      targetPort: 8880
