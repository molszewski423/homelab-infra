---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ams-chroma
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ams-output
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ams-data
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ams-intelligence
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ams-intelligence
  template:
    metadata:
      labels:
        app: ams-intelligence
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      nodeSelector:
        kubernetes.io/hostname: mikepc
      containers:
        - name: ams-intelligence
          image: registry.gitlab.com/molszewski423/ams-intelligence:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8502
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
          volumeMounts:
            - name: chroma
              mountPath: /app/chroma_db
            - name: output
              mountPath: /app/output
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2"
      volumes:
        - name: chroma
          persistentVolumeClaim:
            claimName: ams-chroma
        - name: output
          persistentVolumeClaim:
            claimName: ams-output
        - name: data
          persistentVolumeClaim:
            claimName: ams-data
---
apiVersion: v1
kind: Service
metadata:
  name: ams-intelligence
  namespace: ai
spec:
  selector:
    app: ams-intelligence
  ports:
    - port: 8502
      targetPort: 8502
