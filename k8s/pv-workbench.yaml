---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pv-workbench-chroma
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pv-workbench-output
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-workbench
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pv-workbench
  template:
    metadata:
      labels:
        app: pv-workbench
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      nodeSelector:
        kubernetes.io/hostname: mikepc
      containers:
        - name: pv-workbench
          image: registry.gitlab.com/molszewski423/pv-workbench:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
          volumeMounts:
            - name: chroma
              mountPath: /app/chroma_db
            - name: output
              mountPath: /app/output
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2"
      volumes:
        - name: chroma
          persistentVolumeClaim:
            claimName: pv-workbench-chroma
        - name: output
          persistentVolumeClaim:
            claimName: pv-workbench-output
---
apiVersion: v1
kind: Service
metadata:
  name: pv-workbench
  namespace: ai
spec:
  selector:
    app: pv-workbench
  ports:
    - port: 8501
      targetPort: 8501
