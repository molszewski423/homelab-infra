---
# IP allowlist: LAN + Tailscale CGNAT + k8s pod/service networks
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: ai
spec:
  ipAllowList:
    sourceRange:
      - 192.168.4.0/24
      - 100.64.0.0/10
      - 10.42.0.0/16
      - 10.43.0.0/16
      - 127.0.0.1/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-apps
  namespace: ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: ai-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: pv.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pv-workbench
                port:
                  number: 8501
    - host: ams.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ams-intelligence
                port:
                  number: 8502
---
# IP allowlist for agency namespace
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: agency
spec:
  ipAllowList:
    sourceRange:
      - 192.168.4.0/24
      - 100.64.0.0/10
      - 10.42.0.0/16
      - 10.43.0.0/16
      - 127.0.0.1/32
---
# LAN-only ingress for agency dashboard, CFO, n8n
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agency-internal
  namespace: agency
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: agency-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: dashboard.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agency-command
                port:
                  number: 8100
    - host: cfo.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agency-cfo
                port:
                  number: 8108
    - host: n8n.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agency-n8n
                port:
                  number: 5678
