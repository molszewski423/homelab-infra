---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-apps
  namespace: ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: pv.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pv-workbench
                port:
                  number: 8501
    - host: ams.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ams-intelligence
                port:
                  number: 8502
