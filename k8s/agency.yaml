apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-postgres
  namespace: agency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agency-postgres
  template:
    metadata:
      labels:
        app: agency-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: archbox
      containers:
      - name: postgres
        image: docker.io/postgres:16-alpine
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: agency-env
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - agency
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 500m
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: agency-postgres-pvc
---
apiVersion: v1
