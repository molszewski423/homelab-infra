apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-tunnel
  namespace: agency
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agency-tunnel
  template:
    metadata:
      labels:
        app: agency-tunnel
    spec:
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: archbox
      initContainers:
      - name: purge-connections
        image: docker.io/curlimages/curl:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        envFrom:
        - secretRef:
            name: agency-env
        command:
        - /bin/sh
        - -c
        args:
        - |
          for f in /proc/[0-9]*/cmdline; do
            argv0=$(cat "$f" 2>/dev/null | tr '\0' '\n' | head -1) || continue
            [ "$argv0" = "cloudflared" ] || continue
            pid=${f%/cmdline}; pid=${pid#/proc/}
            echo "killing ghost cloudflared pid=$pid"
            kill -9 "$pid" 2>/dev/null || true
          done
          sleep 3
          curl -sf --max-time 10 -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/c7f77378cf53b5436dacbc6a8e673cc4/cfd_tunnel/2ef09425-ed87-4c07-a0e4-ecca2041dcdf/connections" || true
          sleep 3
      containers:
      - name: tunnel
        image: docker.io/cloudflare/cloudflared:latest
        imagePullPolicy: IfNotPresent
        args:
        - tunnel
        - --no-autoupdate
        - --loglevel
        - info
        - --metrics
        - localhost:2000
        - --protocol
        - http2
        - --edge-ip-version
        - '4'
        - run
        envFrom:
        - secretRef:
            name: agency-env
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 30
          periodSeconds: 60
          failureThreshold: 3
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 200m
