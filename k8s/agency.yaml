apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-video
  namespace: agency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agency-video
  template:
    metadata:
      labels:
        app: agency-video
    spec:
      nodeSelector:
        kubernetes.io/hostname: archbox
      containers:
      - name: video
        image: localhost/agency-video:latest
        imagePullPolicy: Never
        envFrom:
        - secretRef:
            name: agency-env
        env:
        - name: RENDER_HOST
          value: 100.97.45.57
        - name: RENDER_USER
          value: mike
        - name: RENDER_KEY
          value: /root/.ssh/id_ed25519
        volumeMounts:
        - name: data
          mountPath: /data
        - name: render-key
          mountPath: /root/.ssh
          readOnly: true
        resources:
          requests:
            memory: 32Mi
            cpu: 25m
          limits:
            memory: 256Mi
            cpu: 500m
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: agency-data-pvc
      - name: render-key
        secret:
          secretName: video-render-key
          defaultMode: 256
---
apiVersion: v1
kind: Service
metadata:
  name: agency-video
  namespace: agency
spec:
  selector:
    app: agency-video
  ports:
  - port: 8111
    targetPort: 8111
