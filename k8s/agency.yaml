  selector:
    matchLabels:
      app: agency-bi
  template:
    metadata:
      labels:
        app: agency-bi
    spec:
      nodeSelector:
        kubernetes.io/hostname: archbox
      containers:
      - name: bi
        image: localhost/agency-bi:latest
        imagePullPolicy: Never
        envFrom:
        - secretRef:
            name: agency-env
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: 32Mi
            cpu: 25m
          limits:
            memory: 256Mi
            cpu: 500m
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: agency-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: agency-bi
  namespace: agency
spec:
  selector:
    app: agency-bi
  ports:
  - port: 8106
    targetPort: 8106
