apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
# Ollama itself runs as a systemd service directly on mikepc (not in k8s) — see
# CLAUDE.md. This Service+Endpoints pair just gives in-cluster pods (argus-bot,
# pv-workbench, ams-intelligence, open-webui) a stable "ollama:11434" DNS name
# that forwards to the host. No selector/Deployment here on purpose: a k8s-managed
# Ollama pod would want hostPort 11434 on mikepc too, which the systemd service
# already occupies.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
spec:
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: ai
subsets:
  - addresses:
      - ip: 192.168.4.54
    ports:
      - port: 11434
        protocol: TCP
